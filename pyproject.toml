[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-peer"
version = "2.0.2"
description = "Peer-to-peer research handoff for Claude Code"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Peer contributors"}]
dependencies = []

[project.scripts]
research-peer = "research_peer.cli:main"
rp = "research_peer.cli:rp_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
